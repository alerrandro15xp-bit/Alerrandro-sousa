<!DOCTYPE html>

<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={"darkMode":"class","theme":{"extend":{"colors":{"primary":"#004ac6","on-error-container":"#93000a","on-secondary-fixed-variant":"#653e00","on-tertiary-fixed-variant":"#005049","on-background":"#0b1c30","secondary":"#855300","on-tertiary-fixed":"#00201d","primary-fixed":"#dbe1ff","surface":"#f8f9ff","background":"#f8f9ff","on-error":"#ffffff","on-primary-container":"#eeefff","on-tertiary-container":"#b3fff3","inverse-on-surface":"#eaf1ff","on-secondary-container":"#684000","secondary-fixed-dim":"#ffb95f","inverse-primary":"#b4c5ff","tertiary-fixed-dim":"#6bd8cb","surface-container-high":"#dce9ff","on-surface":"#0b1c30","surface-dim":"#cbdbf5","tertiary":"#006058","outline-variant":"#c3c6d7","surface-container-highest":"#d3e4fe","on-surface-variant":"#434655","error-container":"#ffdad6","error":"#ba1a1a","surface-bright":"#f8f9ff","tertiary-fixed":"#89f5e7","surface-container-lowest":"#ffffff","on-secondary-fixed":"#2a1700","primary-container":"#2563eb","on-tertiary":"#ffffff","surface-container-low":"#eff4ff","surface-container":"#e5eeff","on-primary-fixed-variant":"#003ea8","secondary-container":"#fea619","primary-fixed-dim":"#b4c5ff","surface-tint":"#0053db","on-secondary":"#ffffff","on-primary":"#ffffff","tertiary-container":"#007b71","secondary-fixed":"#ffddb8","outline":"#737686","on-primary-fixed":"#00174b","inverse-surface":"#213145","surface-variant":"#d3e4fe"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"margin-sm":"1rem","space-xs":"0.25rem","space-sm":"0.5rem","space-md":"1rem","space-xl":"2.5rem","gutter":"1.5rem","gutter-sm":"1rem","margin":"2rem","space-lg":"1.5rem"},"fontFamily":{"headline-lg":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"headline-lg-mobile":["Plus Jakarta Sans"],"display-lg-mobile":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"label-lg":["Plus Jakarta Sans"],"display-lg":["Plus Jakarta Sans"],"headline-sm":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"]},"fontSize":{"headline-lg":["30px",{"lineHeight":"38px","letterSpacing":"-0.015em","fontWeight":"700"}],"body-sm":["14px",{"lineHeight":"20px","fontWeight":"400"}],"headline-lg-mobile":["24px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"700"}],"display-lg-mobile":["32px",{"lineHeight":"40px","letterSpacing":"-0.015em","fontWeight":"800"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"headline-md":["22px",{"lineHeight":"30px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"label-lg":["15px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"600"}],"display-lg":["40px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"800"}],"headline-sm":["18px",{"lineHeight":"26px","fontWeight":"600"}],"label-md":["13px",{"lineHeight":"18px","letterSpacing":"0.02em","fontWeight":"600"}],"label-sm":["11px",{"lineHeight":"16px","letterSpacing":"0.04em","fontWeight":"700"}]}}}}</script></head><body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-margin-sm md:p-margin"><main class="w-full max-w-md mx-auto"><div class="flex flex-col w-full">
<div class="relative w-full overflow-hidden rounded-xl bg-surface-container-lowest p-space-md sm:p-space-lg shadow-sm">
<div class="absolute -top-16 -right-16 w-44 h-44 rounded-full bg-primary-fixed/30 blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-16 -left-16 w-44 h-44 rounded-full bg-secondary-fixed/40 blur-2xl pointer-events-none"></div>
<header class="relative flex flex-col items-center text-center mb-space-lg">
<div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-surface-container-high text-primary shadow-sm mb-space-sm">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
</div>
<div class="flex items-center gap-space-xs">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Estudaí</h1>
<span class="w-2 h-2 rounded-full bg-secondary-container"></span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs mt-space-xs">
        Seu espaço diário de reforço escolar simples e direto
      </p>
</header>
<div class="relative flex p-1 rounded-xl bg-surface-container mb-space-lg">
<button class="flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-semibold" id="tab-login" onclick="switchAuthMode('login')" type="button">
        Entrar
      </button>
<button class="flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface" id="tab-register" onclick="switchAuthMode('register')" type="button">
        Criar conta
      </button>
</div>
<form class="flex flex-col space-y-space-md" id="auth-form" onsubmit="event.preventDefault(); handleAuthSubmit();">
<div class="hidden flex-col space-y-1" id="name-field-group">
<label class="font-label-md text-label-md text-on-surface" for="name">
          Nome completo
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">person</span>
<input class="w-full h-12 pl-10 pr-4 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none focus:bg-surface-container-lowest transition-all" id="name" name="name" placeholder="Ex: Lucas Ferreira Silva" type="text"/>
</div>
</div>
<div class="flex flex-col space-y-1">
<label class="font-label-md text-label-md text-on-surface" for="email">
          E-mail
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">mail</span>
<input class="w-full h-12 pl-10 pr-4 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none focus:bg-surface-container-lowest transition-all" id="email" name="email" required="" type="email" value="lucas.silva@estudante.com.br"/>
</div>
</div>
<div class="flex flex-col space-y-1">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">
            Senha
          </label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#" id="forgot-password-link">
            Esqueci minha senha
          </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full h-12 pl-10 pr-11 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none focus:bg-surface-container-lowest transition-all" id="password" name="password" placeholder="Digite seus caracteres secretos" required="" type="password" value="Estuda@2025"/>
<button aria-label="Alternar exibição da senha" class="absolute right-3 p-1 text-outline hover:text-on-surface transition-colors flex items-center justify-center" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<div class="pt-space-xs">
<button class="w-full h-12 rounded-xl bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg shadow-sm transition-all flex items-center justify-center gap-space-xs cursor-pointer active:scale-[0.99]" id="submit-button" type="submit">
<span id="submit-text">Entrar no Estudaí</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<div class="flex items-start gap-space-xs p-3 rounded-lg bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined text-secondary text-[18px] mt-0.5" style="font-variation-settings: 'FILL' 1;">tips_and_updates</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
<strong class="font-semibold text-on-surface">Dica:</strong> use o e-mail cadastrado na sua escola ou informado pelos seus responsáveis.
        </p>
</div>
</form>
<footer class="mt-space-lg pt-space-md text-center">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" id="switch-footer-link" onclick="toggleAuthMode()" type="button">
        Ainda não tem cadastro? <span class="text-primary font-semibold underline underline-offset-4">Crie sua conta gratuitamente</span>
</button>
<div class="mt-space-md flex items-center justify-center gap-2 text-outline">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-label-sm text-label-sm">Ambiente seguro focado em estudantes</span>
</div>
</footer>
</div>
</div>
<script>
  let currentAuthMode = 'login';

  function switchAuthMode(mode) {
    currentAuthMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const nameFieldGroup = document.getElementById('name-field-group');
    const forgotPasswordLink = document.getElementById('forgot-password-link');
    const submitText = document.getElementById('submit-text');
    const switchFooterLink = document.getElementById('switch-footer-link');
    const nameInput = document.getElementById('name');

    if (mode === 'login') {
      tabLogin.className = 'flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-semibold';
      tabRegister.className = 'flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface';
      
      nameFieldGroup.classList.add('hidden');
      nameInput.removeAttribute('required');
      forgotPasswordLink.classList.remove('invisible');
      submitText.textContent = 'Entrar no Estudaí';
      switchFooterLink.innerHTML = 'Ainda não tem cadastro? <span class="text-primary font-semibold underline underline-offset-4">Crie sua conta gratuitamente</span>';
    } else {
      tabRegister.className = 'flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-semibold';
      tabLogin.className = 'flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface';
      
      nameFieldGroup.classList.remove('hidden');
      nameInput.setAttribute('required', 'true');
      forgotPasswordLink.classList.add('invisible');
      submitText.textContent = 'Criar conta no Estudaí';
      switchFooterLink.innerHTML = 'Já possui uma conta? <span class="text-primary font-semibold underline underline-offset-4">Acesse com suas credenciais</span>';
    }
  }

  function toggleAuthMode() {
    switchAuthMode(currentAuthMode === 'login' ? 'register' : 'login');
  }

  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('password-toggle-icon');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      toggleIcon.textContent = 'visibility';
    }
  }

  function handleAuthSubmit() {
    const submitBtn = document.getElementById('submit-button');
    const submitText = document.getElementById('submit-text');
    const originalText = submitText.textContent;
    
    submitBtn.disabled = true;
    submitText.textContent = currentAuthMode === 'login' ? 'Acessando plataforma...' : 'Configurando acesso...';
    
    setTimeout(() => {
      submitBtn.disabled = false;
      submitText.textContent = originalText;
    }, 1200);
  }
</script></main></body></html>
